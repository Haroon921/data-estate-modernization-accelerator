name: Bug report
description: Report a reproducible problem with an accelerator asset
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve the accelerator. Do not include credentials or customer data.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Assessment
        - Decision router
        - Business case
        - Migration or infrastructure
        - Validation
        - Modernization
        - Enablement or documentation
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Run ...
        2. Provide synthetic input ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the OS, Python version, and relevant tool versions.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Add sanitized logs or screenshots if useful.
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: I removed credentials, connection strings, customer data, and tenant-specific identifiers.
          required: true
