name: Feature request
description: Propose a focused improvement to the accelerator
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Assessment
        - Decision router
        - Business case
        - Migration or infrastructure
        - Validation
        - Modernization
        - Enablement or documentation
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the delivery or engineering problem, not only the proposed implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Explain the expected behavior and who benefits.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence
      description: Link relevant official documentation or provide sanitized, reproducible evidence.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
